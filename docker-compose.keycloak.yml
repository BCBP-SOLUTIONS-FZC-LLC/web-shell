# Local Keycloak for the web-shell login (requires Docker Desktop)
# Start: npm run keycloak:dev
# Admin console: http://localhost:8080 (admin / admin)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Mount only the custom theme so built-in parent themes stay in the image.
      - ./keycloak/themes/bcbp:/opt/keycloak/themes/bcbp:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:8080/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
