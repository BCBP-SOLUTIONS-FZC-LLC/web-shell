server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files each deploy or environment replaces must revalidate; hashed files under /assets/ are
    # immutable. /config/runtime.json is the environment's runtime config (mount over the default),
    # /remotes/manifest.json the remote manifest, /version.json the build the SDK polls for.
    location = /config/runtime.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /remotes/manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
