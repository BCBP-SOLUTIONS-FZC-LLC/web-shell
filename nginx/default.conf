server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Compress text responses. CloudFront compresses too; this covers the image served on its own.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Baseline headers on every response, as a second layer under CloudFront's (which also sends the
    # platform CSP and HSTS: a CSP here would be enforced alongside it). `merge` keeps them in the
    # locations below that add their own Cache-Control (nginx 1.29.3+).
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Per-environment headers, none in the image. An environment served WITHOUT CloudFront mounts the
    # platform CSP here (nginx/security.d/csp.conf.example); one behind CloudFront mounts nothing, since
    # two CSPs would both be enforced. Read at start; nothing is written, so a read-only root works.
    include /etc/nginx/security.d/*.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Files each deploy or environment replaces must revalidate; hashed files under /assets/ are
    # immutable. /config/runtime.json is the environment's runtime config (mount over the default),
    # /remotes/manifest.json the remote manifest, /version.json the build the SDK polls for.
    location = /config/runtime.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /remotes/manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The platform's SPA rule (platform-reactcommon examples/cloudfront/spa-rewrite.js): only
    # extension-less paths are app routes and get index.html. Missing API, config, remote or asset
    # files, and any missing file with an extension, stay 404, so the SDK sees a real error (a
    # deploy that removed old chunks reloads once) instead of an HTML page.
    # Dotfiles and dot-directories (/.git/, /.env) are never app routes.
    location ~ "/\." {
        return 404;
    }

    location ~ "^/(api|otel|csp-report|config|remotes|assets)(/|$)" {
        try_files $uri =404;
    }

    # Unhashed files (public/ images, favicons) revalidate: the platform sets Cache-Control on every
    # object (examples/cloudfront README), so browsers never fall back to heuristic caching.
    location ~ "\.[^/]*$" {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
