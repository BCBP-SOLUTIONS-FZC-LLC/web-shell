# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/web-shell
#
# Parallel flow:
#
#   validate-test ──────┐
#   build-image ────────┤──► trivy ──────┐
#                       │   smoke ───────┤──► pr-summary (PR events only)
#                       └────────────────┤──► push       (push events only, needs quality too)
#   validate-quality ───────────────────┤
#   browser ────────────────────────────┘
#   dashboard-contract ──► pr-summary   (informational: never gates push)
#
# build-image lints the Dockerfile (Hadolint + .dockerignore check) as its
# first steps, before the expensive build — a lint failure never starts the
# build, and there's no separate lint-dockerfile job to pay a job-minute for.
# validate-test runs the typecheck and production build and gates trivy/smoke.
# validate-quality gates push/release only (audit + supply-chain checks).
# browser runs the production build in Chromium, Firefox and WebKit under the production CSP
# (test/browser); it gates push. dashboard-contract builds mfe-dashboard (vars.DASHBOARD_REF, default
# main) and runs test/browser/dashboard.spec.ts against it: the real remote in this shell.
# It reports but does not gate push, since that repository's main moves on its own.
# pr-summary posts a status table on pull_request events, failures included.
#
# paths-ignore skips this entire pipeline for commits that only touch Markdown.
# A commit that touches both docs and code still runs normally (paths-ignore
# only skips when EVERY changed file matches).
#
name: CI

"on":
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE_NAME: ghcr.io/bcbp-solutions-fzc-llc/web-shell
  BUILDKIT_PROGRESS: plain

jobs:
  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml
    secrets: inherit

  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml
    secrets: inherit

  build-image:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Check .dockerignore exists
        run: test -f .dockerignore

      - name: Prepare Docker build
        id: cache
        env:
          REGISTRY_REF: ${{ env.IMAGE_NAME }}:buildcache
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash .github/scripts/docker-build-prep.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image → cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.cache.outputs.SOURCE_DATE_EPOCH }}

  trivy:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Load image from cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: web-shell-ci-test
          cache-from: type=gha
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}

      - name: Cache Trivy DB
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/trivy-cache
          key: trivy-db-${{ runner.os }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Trivy scan — CRITICAL / HIGH / UNKNOWN
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: web-shell-ci-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH,UNKNOWN
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache-dir: /tmp/trivy-cache

      - name: Trivy scan — SARIF upload
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: web-shell-ci-test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          cache-dir: /tmp/trivy-cache

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.1
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy SBOM — CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: web-shell-ci-test
          format: cyclonedx
          output: sbom.cyclonedx.json
          exit-code: '0'
          cache-dir: /tmp/trivy-cache

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [validate-test, build-image]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Load image from cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: web-shell-ci-test
          cache-from: type=gha
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}

      # The smoke suite (test/smoke) validates the runtime files with the SDK, so it needs the
      # packages: GitHub Packages through .npmrc, as in validate-test.
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke tests
        run: bash .github/scripts/smoke-tests.sh

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image for the exact @playwright/test version: browsers, their system libraries
    # and Node 26 preinstalled, so nothing comes from apt (the Ubuntu mirror once took 22 min for
    # `install --with-deps`). Bump the tag and digest with @playwright/test (the first step checks).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image has this @playwright/test's browsers
        run: |
          missing=$(npx --no-install playwright install --dry-run chromium firefox webkit \
            | awk '/Install location:/ {print $3}' | while read -r dir; do [ -d "${dir}" ] || echo "${dir}"; done)
          if [ -n "${missing}" ]; then
            echo "::error file=.github/workflows/ci.yml,title=Playwright image::The job container lacks ${missing//$'\n'/, } for @playwright/test $(npx --no-install playwright --version); bump the image tag and digest with it"
            exit 1
          fi
          echo "  ✔  $(npx --no-install playwright --version): every browser is in the image"

      - name: Production build
        run: npm run build

      - name: Browser tests
        run: npm run -s test-browser

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  dashboard-contract:
    name: Dashboard contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's image for the exact @playwright/test version: browsers, their system libraries
    # and Node 26 preinstalled, so nothing comes from apt (the Ubuntu mirror once took 22 min for
    # `install --with-deps`). Bump the tag and digest with @playwright/test (the first step checks).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      # Public repository: the default token reads it.
      - name: Checkout mfe-dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: BCBP-SOLUTIONS-FZC-LLC/mfe-dashboard
          ref: ${{ vars.DASHBOARD_REF || 'main' }}
          path: .remote/mfe-dashboard
          persist-credentials: false

      - name: Install dependencies (shell and dashboard)
        run: |
          npm ci
          npm ci --prefix .remote/mfe-dashboard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the dashboard remote
        run: npm run build --prefix .remote/mfe-dashboard
        env:
          BUILD_VERSION: contract-${{ github.sha }}

      - name: Check the image has this @playwright/test's browsers
        run: |
          missing=$(npx --no-install playwright install --dry-run chromium firefox webkit \
            | awk '/Install location:/ {print $3}' | while read -r dir; do [ -d "${dir}" ] || echo "${dir}"; done)
          if [ -n "${missing}" ]; then
            echo "::error file=.github/workflows/ci.yml,title=Playwright image::The job container lacks ${missing//$'\n'/, } for @playwright/test $(npx --no-install playwright --version); bump the image tag and digest with it"
            exit 1
          fi
          echo "  ✔  $(npx --no-install playwright --version): every browser is in the image"

      - name: Production build
        run: npm run build

      - name: Dashboard contract tests
        run: npm run -s test-contract
        env:
          REMOTE_DIST: .remote/mfe-dashboard/dist

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-contract-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    needs: [validate-test, validate-quality, build-image, trivy, smoke, browser, dashboard-contract]
    if: always() && github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Post or update summary comment
        uses: actions/github-script@v9.0.0
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('fs')
            const code = fs.readFileSync('.github/scripts/pr-summary.js', 'utf8')
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor
            const run = new AsyncFunction('github', 'context', 'core', 'require', 'process', code)
            await run(github, context, core, require, process)

  push:
    name: Push image → GHCR
    runs-on: ubuntu-latest
    needs: [validate-test, trivy, smoke, validate-quality, browser]
    if: github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set SOURCE_DATE_EPOCH
        id: sde
        run: bash .github/scripts/set-source-date-epoch.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        id: pushed
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.SOURCE_DATE_EPOCH }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing via Sigstore OIDC.
      # Verifiable with: cosign verify --certificate-identity-regexp ACTOR \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #   ghcr.io/bcbp-solutions-fzc-llc/web-shell@DIGEST
      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/.github/workflows/.*@refs/heads/(main|master)$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE_NAME }}@${{ steps.pushed.outputs.digest }}"

      - name: Log image digest
        env:
          IMAGE_DIGEST: ${{ steps.pushed.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/log-image-digest.sh
