# Reusable workflow — test gate.
# Unit · integration · e2e, then a 95% coverage gate, then the production build.
# Called by ci.yml and release.yml. Gates trivy and smoke.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests — unit · integration · e2e
        run: npm run test:coverage

      - name: Coverage threshold gate (≥ 95%)
        id: gate
        run: node .github/scripts/coverage-gate.mjs

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 30

      - name: Typecheck and production build
        run: npm run build
